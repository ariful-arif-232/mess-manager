name: Verify Splash Resource (temporary)

on:
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Build unsigned release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Inspect compiled resources for the splash fix
        run: |
          AAPT2=$(find "$ANDROID_HOME" -iname "aapt2" -type f 2>/dev/null | sort -V | tail -1)
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "Using aapt2: $AAPT2"
          echo "Inspecting: $APK"
          echo
          echo "=== Confirming no drawable/splash.xml exists anymore ==="
          if "$AAPT2" dump resources "$APK" | grep -q "drawable/splash "; then
            echo "::error::A drawable named exactly 'splash' still exists in compiled resources"
            exit 1
          else
            echo "PASS: no drawable resource named 'splash' in the compiled APK"
          fi
          echo
          echo "=== Theme.SplashScreen windowBackground resolution ==="
          "$AAPT2" dump resources "$APK" | grep -A 30 -i "SplashScreen" || true
          echo
          echo "=== drawable/splash_icon entry (must be a PNG file, not XML) ==="
          "$AAPT2" dump resources "$APK" | grep -A 5 "drawable/splash_icon" || true
          echo
          echo "=== Full badging (theme/activity sanity check) ==="
          "$AAPT2" dump badging "$APK" | head -20
          echo
          echo "=== xmltree of AndroidManifest to confirm SPLASH_IMAGE_DRAWABLE meta-data ==="
          "$AAPT2" dump xmltree "$APK" --file AndroidManifest.xml | grep -B2 -A2 "SPLASH_IMAGE_DRAWABLE"

      - name: Extract and verify splash_icon.png is a real bitmap, not XML
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          mkdir -p /tmp/splash-check
          cd /tmp/splash-check
          unzip -o "$APK" -d extracted > /dev/null
          FOUND=$(find extracted/res -iname "*.png" | xargs -I{} sh -c 'file "{}"' | grep -i "PNG image" | head -5)
          echo "PNG drawables found in APK:"
          echo "$FOUND"
          if [ -z "$FOUND" ]; then
            echo "::error::No PNG drawables found at all — something is very wrong"
            exit 1
          fi
          echo "PASS"
