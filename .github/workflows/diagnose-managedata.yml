name: Verify TWA components (temporary)

on:
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Clean build of the release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew clean :app:assembleRelease --no-daemon --stacktrace

      - name: Extract the AAR the build consumed
        run: |
          AAR=$(find ~/.gradle/caches -name "androidbrowserhelper-*.aar" | head -1)
          echo "AAR: $AAR"
          rm -rf /tmp/aar && mkdir -p /tmp/aar && cd /tmp/aar
          unzip -o "$AAR" > /dev/null
          rm -rf classes && unzip -o classes.jar -d classes > /dev/null

      - name: ASSERT every component the library enables is declared in the merged manifest
        working-directory: android
        run: |
          MERGED=$(find app/build/intermediates -name "AndroidManifest.xml" -path "*merged_manifest*" | head -1)
          echo "Merged manifest: $MERGED"
          FAIL=0
          FOUND_ANY=0
          for f in $(find /tmp/aar/classes -name "*.class"); do
            CLS=$(echo "$f" | sed 's|/tmp/aar/classes/||; s|/|.|g; s|\.class$||')
            if javap -p -c -classpath /tmp/aar/classes "$CLS" 2>/dev/null | grep -q "setComponentEnabledSetting"; then
              FOUND_ANY=1
              echo "Library class toggles a component: $CLS"
              # every ComponentName(context, X.class) it builds must be declared
              for COMP in $(javap -p -c -classpath /tmp/aar/classes "$CLS" 2>/dev/null \
                    | grep -oE "// class [a-zA-Z0-9/$]+" | sed 's|// class ||; s|/|.|g' | sort -u); do
                case "$COMP" in
                  *Activity|*Service|*Receiver|*Provider)
                    if grep -q "$COMP" "$MERGED"; then
                      echo "  DECLARED in merged manifest: $COMP"
                    else
                      echo "::error::NOT DECLARED in merged manifest: $COMP — setComponentEnabledSetting will throw IllegalArgumentException at launch"
                      FAIL=1
                    fi
                    ;;
                esac
              done
            fi
          done
          if [ "$FOUND_ANY" = "0" ]; then
            echo "::error::Found no library class calling setComponentEnabledSetting — the scan is broken, not the app"
            exit 1
          fi
          [ "$FAIL" = "0" ] || exit 1
          echo "PASS: every component the library toggles is declared."

      - name: ASSERT the compiled APK manifest declares ManageDataLauncherActivity
        working-directory: android
        run: |
          AAPT2=$(find "$ANDROID_HOME" -iname aapt2 -type f | sort -V | tail -1)
          APK=$(find "$PWD/app/build/outputs/apk/release" -name "*.apk" | head -1)
          echo "APK: $APK"
          if "$AAPT2" dump xmltree "$APK" --file AndroidManifest.xml | grep -q "ManageDataLauncherActivity"; then
            echo "PASS: present in the COMPILED APK manifest"
            "$AAPT2" dump xmltree "$APK" --file AndroidManifest.xml | grep -A4 "ManageDataLauncherActivity"
          else
            echo "::error::ManageDataLauncherActivity missing from the compiled APK manifest"
            exit 1
          fi

      - name: Regression guard — splash fix still intact
        working-directory: android
        run: |
          AAPT2=$(find "$ANDROID_HOME" -iname aapt2 -type f | sort -V | tail -1)
          APK=$(find "$PWD/app/build/outputs/apk/release" -name "*.apk" | head -1)
          if "$AAPT2" dump resources "$APK" | grep -q "drawable/splash "; then
            echo "::error::drawable/splash is back"
            exit 1
          fi
          echo "PASS: no drawable/splash; windowBackground still a color:"
          "$AAPT2" dump resources "$APK" | grep -A2 "style/Theme.SplashScreen"

      - name: Reference — how the site-settings shortcut intent is built
        run: |
          javap -p -c -classpath /tmp/aar/classes \
            com.google.androidbrowserhelper.trusted.ManageDataLauncherActivity 2>/dev/null \
            | awk '/getSiteSettingsShortcutOrNull/{f=1} f{print} f&&/^$/{c++; if(c>1) exit}' | head -80
