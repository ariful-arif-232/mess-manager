plugins {
    id 'com.android.application'
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasKeystoreProperties = keystorePropertiesFile.exists()
if (hasKeystoreProperties) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'app.messmanager.twa'
    compileSdk 36

    defaultConfig {
        applicationId "app.messmanager.twa"
        // androidbrowserhelper 2.7.3 (resolved by this build) requires 23.
        minSdk 23
        targetSdk 36
        versionCode 6
        versionName "1.0.5"
    }

    signingConfigs {
        release {
            if (hasKeystoreProperties) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // Off on purpose: this app is ~100% library code (the TWA
            // wrapper has no custom Kotlin/Java), so there is negligible
            // size to save, while R8 has a well-documented history of
            // breaking androidx.browser's Custom Tabs AIDL/service-binding
            // code at runtime even when the build succeeds cleanly (that
            // binding is resolved via reflection/Binder proxies R8's
            // static analysis doesn't fully see, so it silently strips or
            // renames what it can't trace — no warning, no build failure,
            // just a crash on launch). Root cause of a real launch failure
            // in a signed release built with this on. See android/README.md.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasKeystoreProperties) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Pinned to exact versions confirmed resolvable by a real CI build
    // (this sandbox can't reach Google's Maven to verify versions itself).
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.3'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.browser:browser:1.10.0'
}
