<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Google Drive · Mess Manager</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<style>
  :root{color-scheme:light dark}
  *{box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:#eef4ff;color:#12213d;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:24px}
  .card{background:#fff;border-radius:22px;padding:36px 28px;max-width:380px;width:100%;box-shadow:0 18px 50px rgba(18,33,61,.14);text-align:center}
  .icon{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;margin:0 auto 16px;font-size:28px}
  .icon.ok{background:linear-gradient(145deg,#dcefe3,#c9f2dd);color:#1c8a52}
  .icon.err{background:linear-gradient(145deg,#fbe0df,#ffd6d3);color:#c73a34}
  h1{font-size:19px;margin:0 0 8px}
  p{color:#5c6b85;margin:0 0 22px;line-height:1.55;font-size:14.5px;word-break:break-word}
  a.btn{display:inline-block;background:#2057c9;color:#fff;text-decoration:none;font-weight:700;font-size:14.5px;padding:13px 22px;border-radius:13px}
  a.btn:active{opacity:.85}
  @media (prefers-color-scheme: dark){
    body{background:#0b1a29;color:#eaf2fc}
    .card{background:#122036;box-shadow:0 18px 50px rgba(0,0,0,.4)}
    p{color:#9fb0cc}
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon" id="icon">⏳</div>
    <h1 id="title">Working…</h1>
    <p id="message">One moment.</p>
    <a class="btn" id="btn" href="./">Return to Mess Manager</a>
  </div>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var ok = q.get('status') !== 'error';
  var icon = document.getElementById('icon');
  var title = document.getElementById('title');
  var message = document.getElementById('message');
  var btn = document.getElementById('btn');
  icon.className = 'icon ' + (ok ? 'ok' : 'err');
  icon.textContent = ok ? '✓' : '!';
  title.textContent = q.get('title') || (ok ? 'Google Drive connected' : 'Not connected');
  message.textContent = q.get('message') || (ok ? 'You can close this tab and go back to Mess Manager.' : 'Close this tab and try again from Settings.');
  // On success, hop back into the app on its own — the button below is just
  // a fallback for browsers that block a script-initiated navigation.
  if (ok) {
    btn.textContent = 'Returning to Mess Manager…';
    setTimeout(function(){ location.replace('./'); }, 1100);
  }
})();
</script>
</body>
</html>
