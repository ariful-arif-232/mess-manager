<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Mess Manager">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07192b"/><stop offset="0.58" stop-color="#061522"/><stop offset="1" stop-color="#020b10"/></linearGradient>
    <linearGradient id="green" x1="0.15" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#63ef57"/><stop offset="0.48" stop-color="#19d548"/><stop offset="1" stop-color="#04964a"/></linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#39e65b"/><stop offset="0.58" stop-color="#11bc4f"/><stop offset="1" stop-color="#047b40"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe76a"/><stop offset="0.55" stop-color="#ffbd25"/><stop offset="1" stop-color="#ed9410"/></linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="0.62" stop-color="#f5f7f8"/><stop offset="1" stop-color="#d9e0e4"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="13" stdDeviation="13" flood-color="#000000" flood-opacity="0.48"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.38"/></filter>
  </defs>

  <rect x="43" y="43" width="914" height="914" rx="185" fill="url(#bg)"/>
  <rect x="49" y="49" width="902" height="902" rx="179" fill="none" stroke="#6ef06a" stroke-width="8"/>
  <rect x="57" y="57" width="886" height="886" rx="171" fill="none" stroke="#0c6a58" stroke-width="3" opacity="0.7"/>

  <g filter="url(#shadow)">
    <!-- exact compact house proportions -->
    <path d="M196 407 L500 150 L805 407" fill="none" stroke="url(#green)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M225 397 V570 C225 676 307 755 421 772" fill="none" stroke="url(#green)" stroke-width="46" stroke-linecap="round"/>
    <path d="M776 397 V514" fill="none" stroke="url(#green)" stroke-width="46" stroke-linecap="round"/>
    <path d="M694 296 V221 H754 V348" fill="url(#green)"/>

    <!-- four-pane window -->
    <g fill="url(#green)" filter="url(#soft)">
      <rect x="454" y="250" width="39" height="39" rx="7"/><rect x="507" y="250" width="39" height="39" rx="7"/>
      <rect x="454" y="303" width="39" height="39" rx="7"/><rect x="507" y="303" width="39" height="39" rx="7"/>
    </g>

    <!-- steam -->
    <path d="M465 405 C435 371 492 350 463 316 M500 405 C470 371 527 350 498 316 M535 405 C505 371 562 350 533 316" fill="none" stroke="#fff" stroke-width="17" stroke-linecap="round"/>

    <!-- left fork, compact and flat like reference -->
    <g fill="url(#gold)" filter="url(#soft)">
      <rect x="291" y="422" width="10" height="73" rx="5"/><rect x="308" y="422" width="10" height="73" rx="5"/><rect x="325" y="422" width="10" height="73" rx="5"/><rect x="342" y="422" width="10" height="73" rx="5"/>
      <path d="M287 482 H356 C356 516 344 538 326 548 L323 656 L307 656 L304 548 C293 541 287 520 287 482 Z"/>
    </g>

    <!-- right spoon -->
    <g fill="url(#gold)" filter="url(#soft)">
      <ellipse cx="668" cy="461" rx="42" ry="63"/>
      <path d="M655 511 H681 L675 636 L650 636 Z"/>
    </g>

    <!-- pot -->
    <g filter="url(#soft)">
      <path d="M386 493 C405 447 451 425 500 425 C549 425 595 447 614 493 Z" fill="url(#white)"/>
      <rect x="465" y="400" width="70" height="31" rx="15" fill="url(#white)"/>
      <rect x="352" y="500" width="296" height="31" rx="15" fill="#fafcfd"/>
      <path d="M372 523 H628 L612 659 C607 706 573 736 527 736 H473 C427 736 393 706 388 659 Z" fill="url(#white)"/>
      <circle cx="500" cy="629" r="62" fill="url(#green)"/>
      <path d="M468 630 L490 651 L535 600" fill="none" stroke="#fff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- lower leaf swoosh -->
    <path d="M424 786 C522 790 608 751 677 681 C724 634 770 598 838 582 C824 648 790 705 744 744 C670 807 566 824 424 786 Z" fill="url(#leaf)"/>
    <path d="M436 789 C541 797 650 751 755 649" fill="none" stroke="#046f3c" stroke-width="7" stroke-linecap="round" opacity="0.62"/>

    <!-- calculator -->
    <g transform="translate(650 645)" filter="url(#soft)">
      <rect width="126" height="137" rx="24" fill="#f7fafb"/>
      <rect x="18" y="16" width="90" height="31" rx="7" fill="#08202a"/>
      <g fill="#12ae55">
        <rect x="20" y="60" width="22" height="22" rx="5"/><rect x="52" y="60" width="22" height="22" rx="5"/><rect x="84" y="60" width="22" height="22" rx="5"/>
        <rect x="20" y="92" width="22" height="22" rx="5"/><rect x="52" y="92" width="22" height="22" rx="5"/><rect x="84" y="92" width="22" height="22" rx="5"/>
      </g>
    </g>
  </g>

  <!-- English-only branding, exact centered layout -->
  <text x="500" y="888" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="74" font-weight="900" letter-spacing="2">
    <tspan fill="#38da4b">MESS</tspan><tspan fill="#f7f8fa"> MANAGER</tspan>
  </text>
</svg>
